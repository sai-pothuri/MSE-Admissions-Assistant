[project]
name = "mse-admissions-assistant"
version = "0.1.0"
description = "RAG backend for the CMU MSE admissions assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "qdrant-client>=1.12",
    "voyageai>=0.3",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "httpx2>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's DI markers (Depends/File/Query/...) are meant to be called as
# argument defaults — that's how FastAPI recognizes them per-request, not
# a shared-mutable-default bug B008 otherwise correctly flags.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Cookie"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# voyageai ships py.typed without following PEP 484's explicit re-export
# convention internally, so strict mode's implicit_reexport check flags its
# own `from x import Y` style. Scoped to voyageai only — first-party app.*
# code keeps the stricter default.
[[tool.mypy.overrides]]
module = ["voyageai", "voyageai.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
